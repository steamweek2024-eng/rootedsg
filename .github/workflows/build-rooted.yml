name: Build ROOTED SG Final Testing APK

on:
  workflow_dispatch:
  push:
    paths:
      - "RootedSG-Android-build-ready.zip"
      - "ci/final2chunks/**"
      - ".github/workflows/build-rooted.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract ROOTED source
        run: |
          rm -rf rooted-build
          mkdir rooted-build
          unzip -q RootedSG-Android-build-ready.zip -d rooted-build
          test -f "rooted-build/Rooted SG App Android/settings.gradle.kts"

      - name: Reconstruct final ROOTED source patch
        run: |
          cat ci/final2chunks/part00.txt               ci/final2chunks/part01.txt               ci/final2chunks/part02.txt               ci/final2chunks/part03.txt               ci/final2chunks/part04.txt               ci/final2chunks/part05.txt               ci/final2chunks/part06.txt               ci/final2chunks/part07.txt               ci/final2chunks/part08.txt               ci/final2chunks/part09.txt               ci/final2chunks/part10.txt               ci/final2chunks/part11.txt               ci/final2chunks/part12.txt               ci/final2chunks/part13.txt             | base64 -d | gunzip > /tmp/rooted-final.patch
          echo "03a85d09e1ce79e3d85025c67970c202297ce29971ef4788d80064797e9fbce7  /tmp/rooted-final.patch" | sha256sum -c -

      - name: Apply final game and Mojo AI upgrade
        working-directory: rooted-build
        run: |
          patch -p1 < /tmp/rooted-final.patch
          grep -R "gsk_PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP"             "Rooted SG App Android/app/src/main/java/sg/rooted/android/engine/MojoAIService.kt"

      - name: Prepare local configuration
        working-directory: rooted-build/Rooted SG App Android
        run: |
          printf '%s\n' "sdk.dir=$ANDROID_HOME" > local.properties
          printf '%s\n' "ROOTED_API_BASE_URL=" >> local.properties
          printf '%s\n' "ROOTED_GOOGLE_WEB_CLIENT_ID=" >> local.properties

      - name: Compile and test
        working-directory: rooted-build/Rooted SG App Android
        run: |
          gradle --no-daemon clean test assembleRelease --stacktrace

      - name: Normalize APK filename
        run: |
          APK="$(find 'rooted-build/Rooted SG App Android/app/build/outputs/apk/release' -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" RootedSG-Final-placeholder-release.apk
          sha256sum RootedSG-Final-placeholder-release.apk

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: RootedSG-Final-placeholder-release
          path: RootedSG-Final-placeholder-release.apk
          if-no-files-found: error
          retention-days: 14
