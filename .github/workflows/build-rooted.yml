name: Build ROOTED SG V2 Testing APK

on:
  workflow_dispatch:
  push:
    paths:
      - "RootedSG-Android-build-ready.zip"
      - "ci/v2chunks/**"
      - ".github/workflows/build-rooted.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract ROOTED source
        run: |
          rm -rf rooted-build
          mkdir rooted-build
          unzip -q RootedSG-Android-build-ready.zip -d rooted-build
          test -f "rooted-build/Rooted SG App Android/settings.gradle.kts"

      - name: Apply ROOTED V2 playable game upgrade
        run: |
          cat ci/v2chunks/part00.txt               ci/v2chunks/part01.txt               ci/v2chunks/part02.txt               ci/v2chunks/part03.txt               ci/v2chunks/part04.txt             | base64 -d | gunzip > /tmp/rooted-v2.patch
          test -s /tmp/rooted-v2.patch
          cd "rooted-build/Rooted SG App Android"
          patch -p1 < /tmp/rooted-v2.patch

      - name: Apply compiler fixes
        working-directory: rooted-build/Rooted SG App Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Weather lambda destructuring fix
          p = Path("app/src/main/java/sg/rooted/android/engine/WeatherService.kt")
          s = p.read_text()
          s = s.replace(
              'points.minByOrNull { (_, pt) -> namePenalty(n, it.first) + haversineKm(target, pt) }?.first',
              'points.minByOrNull { (name, pt) -> namePenalty(n, name) + haversineKm(target, pt) }?.first'
          )
          p.write_text(s)

          # noRippleClickable takes enabled first, so use named onClick
          p = Path("app/src/main/java/sg/rooted/android/ui/pet/MojoCompanion.kt")
          s = p.read_text()
          s = s.replace('.noRippleClickable(onOpenPet)', '.noRippleClickable(onClick = onOpenPet)')
          p.write_text(s)

          # Add missing shape import for the quick-play detective card
          p = Path("app/src/main/java/sg/rooted/android/ui/quests/QuestsScreen.kt")
          s = p.read_text()
          needle = 'import androidx.compose.foundation.shape.CircleShape\n'
          if 'import androidx.compose.foundation.shape.RoundedCornerShape\n' not in s:
              s = s.replace(needle, needle + 'import androidx.compose.foundation.shape.RoundedCornerShape\n')
          p.write_text(s)
          PY

      - name: Prepare local configuration
        working-directory: rooted-build/Rooted SG App Android
        run: |
          printf '%s\n' "sdk.dir=$ANDROID_HOME" > local.properties
          printf '%s\n' "ROOTED_API_BASE_URL=" >> local.properties
          printf '%s\n' "ROOTED_GOOGLE_WEB_CLIENT_ID=" >> local.properties

      - name: Compile and test
        working-directory: rooted-build/Rooted SG App Android
        run: |
          gradle --no-daemon clean test assembleRelease --stacktrace

      - name: Normalize APK filename
        run: |
          APK="$(find 'rooted-build/Rooted SG App Android/app/build/outputs/apk/release' -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" RootedSG-V2-testing-release.apk
          sha256sum RootedSG-V2-testing-release.apk

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: RootedSG-V2-testing-release
          path: RootedSG-V2-testing-release.apk
          if-no-files-found: error
          retention-days: 14
